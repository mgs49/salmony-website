<script>
/* Two looks for the personal pages while Michael decides: "clean" (default) and "fun".
   Adding ?look=fun or ?look=clean to any address switches; the choice is remembered in this browser only. */
(function () { try {
  var q = new URLSearchParams(location.search).get("look");
  if (q === "fun" || q === "clean") localStorage.setItem("look", q);
  if (localStorage.getItem("look") === "fun") document.documentElement.classList.add("fun");
} catch (e) {} })();
</script>

<script>
(function () {
  var b = document.getElementById("look-switch"); if (!b) return;
  var root = document.documentElement;
  function label() { b.textContent = root.classList.contains("fun") ? "Switch to the clean look" : "Switch to the fun look"; }
  b.addEventListener("click", function () {
    var fun = root.classList.toggle("fun");
    try { localStorage.setItem("look", fun ? "fun" : "clean"); } catch (e) {}
    label();
  });
  label(); b.parentNode.hidden = false;
})();
</script>
